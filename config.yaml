# ==========================================
# Pipeline Configuration: config.yaml
# ==========================================

base_path: "data/raw/callisia"

valid_leaf_columns: ["timestamp_ms", "green", "acc_x", "acc_y", "acc_z"]

inference:
  patient_id: "P04"
  target_rate_freq: 40 # Hz, the frequency at which the model will make predictions
  # bvp_freq: 40 # Hz, the frequency of the BVP signal
  # acc_freq: 40 # Hz, the frequency of the accelerometer signal

llm:
  # Configuration for the LLM
  #provider: "google"
  #model_name: "gemini-3.1-flash-lite"
  provider: "ollama-2"
  model_name: "gemma4:latest"
  temperature: 0.7

evaluation:
  # Configuration for the judge model used for evaluation
  provider: "passau"
  model_name: "qwen35-397b"
  temperature: 0.1


params:
  # model need at least 20 seconds of data to make a prediction
  receptive_field_model_seconds: 20

  seconds_per_window: 8
  step_size: 2

thresholds:
  # Thresholds for classifying activity levels based on the hardware for ACC.
  # Values can be adjusted based on multi-metric bounds.

  resting:
    # Must be below all these values to be considered 'True Rest'
    std_magnitude: 15.0
    range_magnitude: 100.0
    mean_jerk: 5.0

  moving:
    # Must be below these values to be considered 'Fidgeting/Light Motion'
    # Anything above is considered 'Active/Walking'
    std_magnitude: 100.0
    range_magnitude: 1200.0
    mean_jerk: 30.0

orchestrator:
  # Configuration for the orchestrator
  run_interval_schedule: 120 # seconds
