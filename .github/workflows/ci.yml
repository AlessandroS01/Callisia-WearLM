name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      # Use a runner-provided temporary directory for the pip cache so the path
      # is cross-platform and writable by the runner. We will cache this path.
      PIP_CACHE_DIR: ${{ runner.temp }}/pip-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip download cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install using the runner temp cache to speed up repeated installs
          pip install --cache-dir "$PIP_CACHE_DIR" -r requirements.txt

      - name: Run linter
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          pylint .

