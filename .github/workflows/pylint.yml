name: Pylint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint with Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    env:
      # Use a standard temporary directory for an explicit pip cache
      # This avoids re-downloading wheels on every CI run
      PIP_CACHE_DIR: /tmp/pip-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          # Cache both the explicit temp cache and the default pip cache
          # so that pip can reuse previously downloaded wheels and wheels cache
          path: |
            ${{ env.PIP_CACHE_DIR }}
            ~/.cache/pip
            ~/.cache/pip/wheels
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --cache-dir "$PIP_CACHE_DIR" -r requirements.txt

      - name: Install linting tools
        run: |
          pip install --cache-dir "$PIP_CACHE_DIR" pylint

      - name: Run pylint on Python files
        run: |
          pylint --disable=too-many-arguments,too-many-positional-arguments,too-many-locals, too-few-public-methods $(git ls-files '*.py')

