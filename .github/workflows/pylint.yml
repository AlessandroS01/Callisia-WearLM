name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install runtime dependencies so pylint can resolve imports used in the
        # project. Adjust this list if your project requires additional packages
        # (or replace with `pip install -r requirements.txt` if you add one).
        pip install pylint pandas matplotlib numpy neurokit2 typing_extensions
    - name: Analysing the code with pylint
      run: |
        pylint $(git ls-files '*.py')
